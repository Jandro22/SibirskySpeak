name: Publish APK release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode"
        required: true
        default: "2"
      version_name:
        description: "Android versionName"
        required: true
        default: "2.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify large content assets
        shell: bash
        run: |
          test -s app/src/main/assets/tatoeba.db
          if head -c 40 app/src/main/assets/tatoeba.db | grep -q "git-lfs.github.com/spec"; then
            echo "tatoeba.db is still an LFS pointer; refusing to publish a release"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run pedagogy simulation
        run: ./gradlew simCheck

      - name: Run Android lint
        run: ./gradlew lint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install preprocess test dependencies
        run: pip install -r tools/preprocess/requirements.txt

      - name: Run content-pipeline tests
        run: python -m pytest -q tools/preprocess

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            code="$INPUT_VERSION_CODE"
            name="$INPUT_VERSION_NAME"
          else
            name="${GIT_TAG#v}"
            code="${name%%.*}"
            tag="$GIT_TAG"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="v$name"
          fi
          [[ "$code" =~ ^[0-9]+$ ]]
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew assembleRelease

      - name: Enforce asset and APK budgets
        run: python tools/verify_budgets.py

      - name: Stage APK with a stable name
        run: cp app/build/outputs/apk/release/app-release.apk SibirskySpeak-${{ steps.version.outputs.version_name }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: SibirskySpeak v${{ steps.version.outputs.version_name }}
          body: |
            SibirskySpeak v${{ steps.version.outputs.version_name }}

            Offline-first Android Russian tutor with adaptive pacing, FSRS spaced repetition, grammar practice, audio, learner backups, and a coverage-aware reader.

            Install **SibirskySpeak-${{ steps.version.outputs.version_name }}.apk** on an Android device. Existing learner data is preserved when installing over the same package and signing key.
          files: SibirskySpeak-${{ steps.version.outputs.version_name }}.apk
          make_latest: true
