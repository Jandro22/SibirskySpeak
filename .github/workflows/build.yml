name: Build APK

# Builds a signed debug APK on every push to main and publishes it to a rolling
# "latest" GitHub Release, so it can be downloaded and installed directly from a
# phone browser — no USB cable needed. Each build's versionCode is the run
# number, so newer builds install cleanly over older ones.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify large content assets
        shell: bash
        run: |
          test -s app/src/main/assets/tatoeba.db
          if head -c 40 app/src/main/assets/tatoeba.db | grep -q "git-lfs.github.com/spec"; then
            echo "tatoeba.db is still an LFS pointer; refusing to run tests against it"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Generate JVM coverage report
        run: ./gradlew jacocoDebugUnitTestReport

      - name: Upload JVM coverage report
        uses: actions/upload-artifact@v4
        with:
          name: sibirsky-speak-jacoco-report
          path: app/build/reports/jacoco/debugUnitTest

      - name: Run pedagogy simulation
        run: ./gradlew simCheck

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Build minified release artifact
        run: ./gradlew assembleRelease

      - name: Verify release artifact exists
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | grep -q "package: name='com.sibirskyspeak'"
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'assets/curriculum_contract.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install preprocess test dependencies
        run: pip install -r tools/preprocess/requirements.txt

      - name: Run content-pipeline tests
        run: python -m pytest -q tools/preprocess

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "0.1.${{ github.run_number }}"
        run: ./gradlew assembleDebug

      - name: Enforce asset and APK budgets
        run: python tools/verify_budgets.py

      - name: Stage APK with a stable name
        run: cp app/build/outputs/apk/debug/app-debug.apk SibirskySpeak.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SibirskySpeak-apk
          path: SibirskySpeak.apk

      - name: Publish to "latest" release
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build from commit ${{ github.sha }}.
            Download **SibirskySpeak.apk** below and open it on your phone to install.
          files: SibirskySpeak.apk
          make_latest: true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  scheduled-instrumentation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Run scheduled QA instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedQaAndroidTest --stacktrace
